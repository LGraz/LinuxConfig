open = [
	{ run = 'xdg-open %s1',                 desc = "xdg-Open", for = "linux", orphan = true},
	# { run = 'open "$@"',                    desc = "Open", for = "macos" },
	# { run = 'start "" "%1"', orphan = true, desc = "Open", for = "windows" },
	{ run = 'mimeopen -a %s1', desc = "mimeopen (ask)"    , for = "linux", block = true}, # requires perl-file-mimeinfo
	{ run = 'mimeopen -d %s1', desc = "mimeopen (default)", for = "linux", block = true}, # requires perl-file-mimeinfo
]
r_to_pdf = [
    { run = '''f=%s1; Rscript -e "knitr::stitch('$f')" && rm -f "${f%.*}.tex" "${f%.*}.log"''', desc = "Stitch PDF from R", for = "linux" },
]
topdf = [
    { run = 'libreoffice --headless --convert-to pdf --outdir %d1 %s', desc = "Convert to PDF", for = "linux" },
]
reduce_videos = [
    { run = 'for file in %s; do HandBrakeCLI -i "$file" -o "${file%.*}_REDUCE.mp4" --preset "Very Fast 480p30"   ; done; ', desc = "REDUCE videos", for = "unix" },
    { run = 'for file in %s; do HandBrakeCLI -i "$file" -o "${file%.*}_Reduce.mp4" --preset "Fast 720p30"        ; done; ', desc = "Reduce videos", for = "unix" },
    { run = 'for file in %s; do HandBrakeCLI -i "$file" -o "${file%.*}_reduce.mp4" --preset "HQ 1080p30 Surround"; done; ', desc = "reduce videos", for = "unix" },
]
browser = [
    { run = '${BROWSER:-firefox} %s', desc = "Browser", for = "linux", orphan = true },
]
copy_content_to_clipboard = [
    { run = 'wl-copy < %s1', desc = "Copy to clipboard", for = "linux" },
]


[open]
prepend_rules = [
    # Documents pptx?|od[dfgpst]|docx?|sxc|xlsx?|xlt|xlw|gnm|gnumeric
    # { url = "*.{odt,ods,odp,doc,docx,xls,xlsx,ppt,pptx,rtf}", use = [ "open", "topdf", "reveal" ] },
    # Video
	{ mime = "video/*", use = [ "play", "open", "reveal", "reduce_videos" ] },
    # html in Browser
	{ mime = "text/html", use = [ "browser", "edit", "open", "reveal" ] },
	# Text
	{ mime = "text/*", use = [ "edit", "copy_content_to_clipboard", "open", "reveal"] },
	# Image
	{ mime = "image/*", use = [ "open", "reveal" ] },
	# Folder
	# { url = "*/", use = [ "open", "reveal" ] },
	# R
	# { url = "*.R", use = [ "r_to_pdf" ] },
]
    ## DEFAULTS
	# # Media
	# { mime = "{audio,video}/*", use = [ "play", "open", "reveal" ] },
