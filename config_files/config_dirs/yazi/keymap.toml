# Toggle panes
[[mgr.prepend_keymap]]
on   = "B"
run  = "plugin toggle-pane min-parent"
desc = "Minimize/Toggle parent pane"
[[mgr.prepend_keymap]]
on   = "V"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"


# Zoom image
[[mgr.prepend_keymap]]
on   = "+"
run  = "plugin zoom 1"
desc = "Zoom in hovered file"
[[mgr.prepend_keymap]]
on   = "-"
run  = "plugin zoom -1"
desc = "Zoom out hovered file"


[[mgr.prepend_keymap]]
on = "q"
run = "close"
desc = "Close the current tab, or quit if it is last tab"

[[mgr.prepend_keymap]]
on  = [ "y" ]
run = [ '''
	shell 'for path in "$@"; do echo "file://$path"; done | wl-copy -t text/uri-list' --confirm
''', "yank" ]

[[mgr.prepend_keymap]]
on   = [ "<C-s>" ]
run  = 'shell "$SHELL" --block --confirm'
desc = "Open shell here"

[[mgr.prepend_keymap]]
on   = "<C-s>"
run  = 'shell "$SHELL" --block --confirm'
desc = "Open shell here"


[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"

[[mgr.prepend_keymap]]
on = [ "<C-n>" ]
# run = '''
# 	shell 'dragon-drop -x -i -T "$@"' --confirm
# '''
run = '''
    shell 'ripdrag "$@" -xA 2>/dev/null &' --confirm
'''

[[mgr.prepend_keymap]]
on   = [ "c", "a" ]
run  = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

# Export to Thunderbird
[[mgr.prepend_keymap]]
on  = "<C-e>"
run = '''
	shell '
		paths=$(for p in "$@"; do echo "$p"; done | paste -s -d,)
		quoted="'\'$paths\''"
		thunderbird -compose "attachment=$quoted"
	'
'''

# Open current selection with Firefox (detached)
[[mgr.prepend_keymap]]
on = [ "F" ]
run = "shell 'firefox \"$@\"' --silent --orphan"
desc = "Open with Firefox (detached)"

# Open current selection with VS Code (detached)
[[mgr.prepend_keymap]]
on = [ "E" ]
run = "shell 'code \"$@\"' --silent --orphan"
desc = "Open with VS Code (detached)"

# SSH
[[mgr.prepend_keymap]]
on = ["M","s"]
run = "plugin sshfs -- menu"
desc = "Open SSHFS options"


